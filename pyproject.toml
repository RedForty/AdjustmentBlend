[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adjustment-blend"
description = "Velocity-matched keyframe interpolation for Maya animation layers."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE.md" }
authors = [{ name = "Daniel Klug" }]
keywords = ["maya", "animation", "keyframe", "animation-layers", "vfx", "rigging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RedForty/AdjustmentBlend"
Source = "https://github.com/RedForty/AdjustmentBlend"

[tool.setuptools]
packages = ["adjustment_blend"]

[tool.setuptools.dynamic]
version = { attr = "adjustment_blend.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Let `pytest` find the package from the repo root without installing it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py37"
